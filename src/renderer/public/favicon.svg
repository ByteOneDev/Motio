<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f6bff"/>
      <stop offset="0.55" stop-color="#6c4cf5"/>
      <stop offset="1" stop-color="#ff4d8d"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#2a1170" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#gloss)"/>
  </g>
  <g filter="url(#glow)">
    <!-- Courbe d'accélération « douce » : l'ADN du motion design. -->
    <path d="M 300 712 C 540 712, 484 320, 712 320" fill="none" stroke="#ffffff" stroke-width="70" stroke-linecap="round"/>
    <circle cx="300" cy="712" r="58" fill="#ffffff"/>
    <!-- Image clé d'arrivée. -->
    <rect x="652" y="260" width="120" height="120" rx="18" fill="#ffd60a" transform="rotate(45 712 320)"/>
  </g>
</svg>
